name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（lint + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          pip install -e .
          pip install pytest httpx ruff
      - name: Ruff 静态检查
        run: ruff check .
      - name: 安装 Playwright Chromium
        run: playwright install --with-deps chromium
      - name: 运行测试（含 PDF 冒烟）
        run: pytest -v

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 + 构建
        run: npm run build
